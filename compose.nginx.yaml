# Select with COMPOSE_FILE=compose.nginx.yaml in .env when the VPS already runs Nginx.
name: smee-crm

services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres

  clamav:
    extends:
      file: compose.yaml
      service: clamav

  app:
    extends:
      file: compose.yaml
      service: app
    ports:
      - "127.0.0.1:${SMEE_HTTP_PORT:-3180}:3000"

volumes:
  postgres_data:
  uploads_data:
  clamav_data:

networks:
  backend:
