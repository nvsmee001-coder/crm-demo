name: smee-crm
x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
services:
  postgres:
    logging: *bounded-logs
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smee
      POSTGRES_USER: smee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smee -d smee"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  clamav:
    logging: *bounded-logs
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    # The official image includes a clamd healthcheck. Signatures update via freshclam.
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  app:
    logging: *bounded-logs
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      SMEE_OWNER_EMAIL: ${SMEE_OWNER_EMAIL:?Set SMEE_OWNER_EMAIL in .env}
      SMEE_ENABLE_DEMO: ${SMEE_ENABLE_DEMO:-false}
      SMEE_REQUIRE_MFA: ${SMEE_REQUIRE_MFA:-false}
      SMEE_MFA_KEY: ${SMEE_MFA_KEY:-}
      DATABASE_URL: postgresql://smee:${POSTGRES_PASSWORD}@postgres:5432/smee
      UPLOAD_DIR: /app/data/uploads
      TRUST_PROXY: "true"
      CLAMAV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    logging: *bounded-logs
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  uploads_data:
  clamav_data:
  caddy_data:
  caddy_config:
networks:
  backend:
